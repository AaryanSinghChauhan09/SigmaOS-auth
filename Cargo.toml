[package]
name = "sigmaos-auth"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Authentication and authorization framework"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-auth"
readme = "README.md"
keywords = ["auth", "authentication", "pam"]
categories = ["authentication"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
sigmaos-crypto = { version = "0.1", path = "../SigmaOS-crypto" }

[profile.release]
opt-level = 3
